name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('clipmaster-pr-{0}', github.event.pull_request.number) || 'clipmaster-publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        shell: powershell
        run: ./scripts/install-dependencies.ps1

      - name: Verify project metadata
        shell: powershell
        run: |
          # 校验语义版本格式 + 与 CHANGELOG 对齐，不写死具体版本号：
          # 写死 '5.0.0' 会让下一次版本号变更直接把 CI 打成红色。
          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "package.json version '$packageVersion' is not valid semver" }
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch [regex]::Escape("## $packageVersion")) { throw "CHANGELOG.md has no '## $packageVersion' section" }
          Write-Host "package version: $packageVersion (matches CHANGELOG)"

      - name: Check dependency overrides match lockfile
        run: node scripts/check-overrides.mjs

      - name: Audit runtime dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit build dependencies
        continue-on-error: true
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Report dependency audit
        if: ${{ always() }}
        shell: powershell
        run: |
          # 审计结果常态写入 job summary；当前为非阻塞（continue-on-error），积累基线后再设阈值。
          $audit = npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            $audit = "npm audit (runtime deps): no high or critical vulnerabilities found."
          }
          "## Dependency audit (runtime deps, non-blocking)`n" + '```' + "`n$audit`n" + '```' |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Run lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Report coverage summary
        shell: powershell
        run: |
          # 不设硬性覆盖率阈值（基线未知，避免 CI 误红），仅把总覆盖率写入 job summary 供人查看。
          $summaryPath = 'coverage/coverage-summary.json'
          if (-not (Test-Path $summaryPath)) { throw "Missing coverage summary: $summaryPath" }
          $summary = Get-Content $summaryPath -Raw | ConvertFrom-Json
          $lines = [math]::Round($summary.total.lines.pct, 2)
          $statements = [math]::Round($summary.total.statements.pct, 2)
          $functions = [math]::Round($summary.total.functions.pct, 2)
          $branches = [math]::Round($summary.total.branches.pct, 2)
          Write-Host "Coverage: lines $lines%, statements $statements%, functions $functions%, branches $branches%"
          $summaryLines = @(
            '## Test coverage'
            ''
            '| Metric | Coverage |'
            '| --- | --- |'
            "| Lines | $lines% |"
            "| Statements | $statements% |"
            "| Functions | $functions% |"
            "| Branches | $branches% |"
          )
          $summaryLines | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          if-no-files-found: error
          path: coverage/

      - name: Typecheck and frontend build check
        run: npm run check:build

      - name: Build app
        run: npm run build

      - name: Generate SHA256 checksums
        shell: powershell
        run: |
          Get-FileHash -Algorithm SHA256 release/*.exe |
            ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii release/checksums.sha256

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ClipMaster-Windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/checksums.sha256
