name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit build dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Run tests
        run: npm test

      - name: Build installer
        run: npm run build -- --publish never

      - name: Generate SHA256 checksums
        shell: powershell
        run: |
          Get-FileHash -Algorithm SHA256 release/*.exe |
            ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii release/checksums.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClipMaster ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/checksums.sha256
