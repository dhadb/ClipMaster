name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('clipmaster-pr-{0}', github.event.pull_request.number) || 'clipmaster-publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        shell: powershell
        run: ./scripts/install-dependencies.ps1

      - name: Verify project metadata
        shell: powershell
        run: |
          # 校验语义版本格式 + 与 CHANGELOG 对齐，不写死具体版本号：
          # 写死 '5.0.0' 会让下一次版本号变更直接把 CI 打成红色。
          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "package.json version '$packageVersion' is not valid semver" }
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch [regex]::Escape("## $packageVersion")) { throw "CHANGELOG.md has no '## $packageVersion' section" }
          Write-Host "package version: $packageVersion (matches CHANGELOG)"

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit build dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Run tests
        run: npm test

      - name: Typecheck and frontend build check
        run: npm run check

      - name: Build app
        run: npm run build

      - name: Generate SHA256 checksums
        shell: powershell
        run: |
          Get-FileHash -Algorithm SHA256 release/*.exe |
            ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii release/checksums.sha256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClipMaster-Windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/checksums.sha256
