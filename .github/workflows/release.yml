name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: clipmaster-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        shell: powershell
        run: ./scripts/install-dependencies.ps1

      - name: Verify release tag
        shell: powershell
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ("v$packageVersion" -ne "$env:GITHUB_REF_NAME") { throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion" }

      - name: Report code-signing mode
        shell: powershell
        run: |
          if ('${{ vars.ENABLE_WINDOWS_CODE_SIGNING }}' -eq 'true') {
            Write-Host 'Windows Authenticode signing is enabled for this release.'
          } else {
            Write-Warning 'Windows Authenticode signing is disabled for this release.'
          }

      - name: Prepare Authenticode certificate
        if: ${{ vars.ENABLE_WINDOWS_CODE_SIGNING == 'true' }}
        shell: powershell
        env:
          WIN_CSC_LINK_BASE64: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK_BASE64)) {
            throw "Missing repository secret WIN_CSC_LINK. Store the base64-encoded PFX certificate in this secret."
          }

          try {
            $certificateBytes = [Convert]::FromBase64String($env:WIN_CSC_LINK_BASE64)
          } catch {
            throw "WIN_CSC_LINK is not valid base64: $($_.Exception.Message)"
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'clipmaster-codesigning.pfx'
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

          try {
            $certificate = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
            $certificate.Import(
              $certificatePath,
              $env:WIN_CSC_KEY_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            )
          } catch {
            throw "WIN_CSC_LINK must contain a valid password-protected PFX/PKCS#12 file: $($_.Exception.Message)"
          }

          if (-not $certificate.HasPrivateKey) {
            throw 'WIN_CSC_LINK certificate does not contain a private key.'
          }

          $hasCodeSigningUsage = @($certificate.Extensions | Where-Object {
            $_.Oid.Value -eq '2.5.29.37' -and $_.EnhancedKeyUsages.ObjectId -contains '1.3.6.1.5.5.7.3.3'
          }).Count -gt 0
          if (-not $hasCodeSigningUsage) {
            throw 'WIN_CSC_LINK certificate does not include the Code Signing enhanced key usage.'
          }

          "WIN_CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check signing password is configured
        if: ${{ vars.ENABLE_WINDOWS_CODE_SIGNING == 'true' }}
        shell: powershell
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "Missing repository secret WIN_CSC_KEY_PASSWORD."
          }

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit build dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Run tests
        run: npm test

      - name: Typecheck and frontend build check
        run: npm run check

      - name: Build signed installer
        if: ${{ vars.ENABLE_WINDOWS_CODE_SIGNING == 'true' }}
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:release

      - name: Build unsigned installer
        if: ${{ vars.ENABLE_WINDOWS_CODE_SIGNING != 'true' }}
        run: npm run build

      - name: Verify Authenticode signatures
        if: ${{ vars.ENABLE_WINDOWS_CODE_SIGNING == 'true' }}
        shell: powershell
        run: ./scripts/verify-authenticode.ps1 -Path release

      - name: Generate SHA256 checksums
        shell: powershell
        run: |
          Get-FileHash -Algorithm SHA256 release/*.exe |
            ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii release/checksums.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClipMaster ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/checksums.sha256

      - name: Remove signing certificate
        if: ${{ always() && vars.ENABLE_WINDOWS_CODE_SIGNING == 'true' }}
        shell: powershell
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'clipmaster-codesigning.pfx') -Force -ErrorAction SilentlyContinue
