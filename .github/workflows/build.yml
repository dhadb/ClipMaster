name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('clipmaster-pr-{0}', github.event.pull_request.number) || 'clipmaster-publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        shell: powershell
        run: ./scripts/install-dependencies.ps1

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit build dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Generate SHA256 checksums
        shell: powershell
        run: |
          Get-FileHash -Algorithm SHA256 release/*.exe |
            ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii release/checksums.sha256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipMaster-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/checksums.sha256
